channel_name: "mystery"
description: "C’est arrivé ici : les secrets du patrimoine français. Un lieu réel, une histoire que personne ne raconte, en moins d'une minute."

# Brain (LLM)
brain:
  scene_count: 11          # plafond
  target_duration: 45      # secondes (surchargé par VIDEO_DURATION dans le workflow)
  seconds_per_scene: 8
  voice_direction: "French storyteller, confident and lively, brisk pacing, leaning in as if sharing a secret"
  language: "fr"
  source_provider: "wikipedia"
  factcheck: "strict"
  default_country_hint: null

  # Choix du sujet : chaque essai doit être bien illustré et son titre doit contenir un retournement
  topic_attempts: 10            # essais de sujet ; si aucun ne passe, le sujet testé le mieux illustré
  min_source_images: 5          # images exploitables du lieu (article source + catégorie Commons) :
                                # licence libre, 1000 px de large au moins, ni logo, ni carte, ni blason
                                # + au moins UNE image de l'objet ou de l'édifice nommé, sinon sujet écarté

  # Véracité : un avertissement du contrôle de véracité n'est jamais ignoré. À la limite d'essais, le sujet
  # est abandonné (plus jamais proposé) et on passe au suivant, jusqu'à ce nombre de sujets par exécution.
  veracity_topic_rounds: 3
  # Matière : faits utilisables sur le sujet précis, extraits de la source avant d'écrire (gros modèle).
  # Moins de min_facts faits, ou une source qui ne répond pas à la question du titre : sujet écarté.
  min_facts: 4
  require_title_answer: true
  # Matière courte (max_facts faits au plus) : vidéo d'environ 30 s (4 scènes) plutôt qu'un script étiré
  short_video: {max_facts: 6, seconds: 32, min_scenes: 4}
  # Jamais moins de 4 scènes (cible et script rendu, tolérance comprise) ; il faut au moins un fait par
  # scène, sinon le sujet est écarté avant d'écrire le script
  min_scenes: 4

  # Sources de sujets, essayées dans l'ordre : anecdotes « Le saviez-vous ? » de Wikipédia (lieu ou objet
  # situé en France, d'après Wikidata), puis recherche Wikipédia par mots-clés aléatoires (repli)
  topic_sources: ["le_saviez_vous", "keywords"]
  le_saviez_vous:
    years: [2010, 2025]       # archives annuelles « Wikipédia:Le saviez-vous ?/Archives/<année> »
    archives_per_run: 2       # années lues par exécution (tirées au hasard), plus la page d'accueil
    include_home: true
    sample: 200               # anecdotes examinées par exécution (Wikidata interrogé par lots de 50)
    cited_articles: 3         # articles cités par l'anecdote, ajoutés à la source (résumé introductif)
    cited_article_chars: 1500

  # Script : jamais de modèle plus petit que gpt-oss-120b ; si ces modèles sont saturés, on attend.
  # Le fact-check passe aussi par ces modèles (véracité).
  script_models: ["gemini", "gpt-oss-120b", "qwen3-235b", "deepseek-chat"]   # fragments de nom
  script_wait_rounds: 3
  script_wait_seconds: 60
  # 429 (limite par minute) : fournisseur suivant dès le premier refus, sans attendre (Groq gpt-oss-20b :
  # 8 000 tokens/min, des 429 en rafale). Si tous les modèles autorisés sont saturés, script_wait_rounds
  # s'applique toujours.
  rate_limit: fallback
  # Notation des accroches (phrase complète, verbe conjugué, note) et extraction des faits : ces modèles.
  # Tâches simples (choix de page, objet de l'anecdote, titre, retournement, doublon, génération des
  # accroches, bandeau, légende) : petits modèles. S'ils échouent tous, repli sur les autres modèles, sauf ceux du script (Gemini et gros modèles).
  simple_models: ["gpt-oss-20b", "llama-3.1-8b", "llama-4-scout", "gpt-4.1-mini", "gpt-4o-mini",
                  "glm-4.5-flash", "qwen-flash"]
  scene_count_tolerance: 1      # (non utilisé par mystery) : de min_scenes à cible + 1 scènes, script accepté
                                # et renuméroté ; hors de cette plage, cible réduite (cible, cible - 1...)
  resume_max_attempts: 2        # 2 échecs du script (toute validation) : sujet abandonné, plus jamais proposé
  resume_max_days: 7
  min_specific_ratio: 0.66      # au moins 4 scènes 'specific' sur 6 (le vrai lieu à l'image)

  # Style parlé : phrases courtes, aucun adjectif décoratif (variantes au féminin et au pluriel incluses)
  style:
    max_sentence_words: 12
    banned_words: ["majeur", "incessant", "escarpé", "imposant", "majestueux", "grandiose", "somptueux",
                   "prestigieux", "emblématique", "remarquable", "magnifique", "spectaculaire", "saisissant",
                   "fascinant", "impressionnant", "splendide", "pittoresque", "séculaire", "millénaire",
                   "verdoyant", "luxuriant", "paisible", "sombre"]

  topic_rules: |
    Fait historique RÉEL, vérifiable, peu connu du grand public.
    Respecter EXACTEMENT la localisation réelle du fait.
    Jamais de lieu générique ou ambigu : toujours le nom complet et précis.

  country: "France"          # tous les lieux du script doivent être dans ce pays

  # name : envoyé au LLM et stocké dans l'historique ; search : mots-clés de recherche Wikipédia
  regions:
    - {name: "Île-de-France (hors Paris intra-muros)", search: ["Yvelines", "Essonne", "Seine-et-Marne", "Val-d'Oise", "Hauts-de-Seine"]}
    - {name: "Bretagne", search: ["Bretagne", "Finistère", "Morbihan", "Côtes-d'Armor", "Ille-et-Vilaine"]}
    - {name: "Normandie", search: ["Normandie", "Calvados", "Manche", "Seine-Maritime", "Orne", "Eure"]}
    - {name: "Hauts-de-France", search: ["Nord", "Pas-de-Calais", "Somme", "Picardie", "Aisne", "Oise"]}
    - {name: "Grand Est (Alsace, Lorraine, Champagne)", search: ["Alsace", "Lorraine", "Champagne", "Vosges", "Ardennes"]}
    - {name: "Bourgogne-Franche-Comté", search: ["Bourgogne", "Franche-Comté", "Jura", "Doubs", "Yonne"]}
    - {name: "Auvergne-Rhône-Alpes", search: ["Auvergne", "Lyon", "Savoie", "Isère", "Ardèche", "Cantal"]}
    - {name: "Nouvelle-Aquitaine", search: ["Gironde", "Dordogne", "Limousin", "Charente", "Pays basque", "Poitou"]}
    - {name: "Occitanie", search: ["Occitanie", "Languedoc", "Toulouse", "Ariège", "Aveyron", "Hérault"]}
    - {name: "Provence-Alpes-Côte d'Azur", search: ["Provence", "Marseille", "Var", "Vaucluse", "Alpes-Maritimes"]}
    - {name: "Corse", search: ["Corse", "Ajaccio", "Bastia"]}
    - {name: "Pays de la Loire", search: ["Nantes", "Vendée", "Anjou", "Sarthe", "Mayenne"]}
    - {name: "Centre-Val de Loire", search: ["Touraine", "Orléans", "Berry", "Loir-et-Cher", "Sologne"]}
    - {name: "Outre-mer français (Guadeloupe, Martinique, Réunion, etc.)", search: ["Guadeloupe", "Martinique", "La Réunion", "Guyane", "Mayotte"]}
    - {name: "Paris intra-muros", search: ["Paris"]}
  region_lookback: 3

  # Ligne éditoriale : chaque vidéo part d'un LIEU ou d'un OBJET du patrimoine français que l'on peut
  # nommer et montrer. Les faits divers criminels et la science générale sont sortis de la ligne.
  theme_categories:
    - name: "un trésor, une relique ou une œuvre du patrimoine français disparu, volé ou jamais retrouvé"
      search: ["trésor perdu", "relique volée", "tableau volé", "manuscrit disparu", "vol trésor cathédrale"]
    - name: "un monument ou un détail visible (façade, statue, plaque, vitrail, gargouille) dont l'histoire cachée contredit ce que l'on croit"
      search: ["statue", "vitrail", "gargouille", "monument historique", "façade"]
    - name: "un château, une abbaye ou un édifice français au destin improbable (vendu, déplacé, englouti, détruit par erreur)"
      search: ["château détruit", "abbaye disparue", "village englouti", "monument déplacé", "édifice démoli"]
    - name: "une loi, un privilège ou une tradition française absurde et réelle, attachée à un lieu précis"
      search: ["ordonnance", "coutume", "privilège", "arrêté", "tradition"]
    - name: "une découverte archéologique faite en France qui a changé ce que l'on savait du lieu"
      search: ["fouilles archéologiques", "découverte archéologique", "site archéologique", "épave", "nécropole"]

  banned_if_recent: ["tunnel", "souterrain", "passage secret", "catacombe", "salle secrète", "chambre secrète"]
  fiction_markers: ["fiction", "fictive", "fictif", "⚠️", "#story", "#storytime", "#horror"]
  niche_keywords: ["patrimoine", "secret", "histoire", "trésor"]


# Audio
audio:
  engines: [gemini, edge]
  batch_tts: true   # toute la narration en UNE requête Gemini (7x moins de quota). false = une requête par scène
  gemini:
    narrator:
      voice: "Charon"
      style: "French storyteller sharing a secret. Warm, deep, confident. Brisk pacing with energy on numbers, dates and names, a short beat before each reveal. Clear diction. Never theatrical, never monotone, never slow."
    witness:
      voice: "Orus"
      style: "French documentary witness. Natural, credible and human. Slightly tense and intimate. Restrained emotion, conversational pacing."
  edge:
    narrator: {voice: "fr-FR-HenriNeural", rate: "+4%", pitch: "-4Hz"}
    witness:  {voice: "fr-FR-HenriNeural", rate: "+2%",  pitch: "-2Hz"}
  pronunciation:
    '\bmythe(s?)\b': 'mite\1'
    '\bmythique(s?)\b': 'mitique\1'
    '\bchâteau\b': 'châto'
    '\bchâteaux\b': 'châtos'
    '\bchaos\b': 'kao'
    '\bchœur(s?)\b': 'keur\1'
    '\barchéolog': 'arkéolog'
    '\barchétype': 'arkétype'
    '\bpsychose\b': 'psycose'

#  Vidéo (Composer)
video_composer:
  video_width: 1080
  video_height: 1920
  fps: 30
  transitions: ["fade", "fade", "fade", "fade"]   # le composer doit faire un modulo (i % len)

  # Audio & Mix
  voice_gain: 1.08
  music_gain: 0.085
  music_fade_duration: 2.5
  transition_duration: 0.2    # coupes nettes : un fondu long ralentit le rythme

  # SFX
  sfx_role_map:
    reveal: "reveal.mp3"
    escalation: "impact.mp3"
    hook: "impact.mp3"
  sfx_mood_map:
    tense: "impact.mp3"
    ominous: "reveal.mp3"
    awe: "reveal.mp3"
  sfx_gain: 0.55
  sfx_fade_out: 0.6

  # Branding & filigrane « C’est arrivé ici » (541 x 160, fond transparent ; 190 px de large -> y 56 à 112,
  # bien au-dessus du bandeau-titre qui commence à y = 230)
  watermark_filename: "cest_arrive_ici_watermark.png"
  watermark_width: 190
  watermark_opacity: 0.85
  watermark_x: 42
  watermark_y: 56

  # Bandeau-titre permanent : « CONSTAT | CHUTE » (on_screen_title), chute sur fond jaune.
  # Affiché pendant toute la vidéo, donc présent sur l'image que YouTube retient comme miniature.
  headline_persistent: true
  headline_font: "Montserrat-Bold.ttf"      # dans assets/shared/fonts
  headline_font_size: 96
  headline_chars_per_line: 18               # la taille se réduit seule si la ligne dépasse
  headline_max_lines: 3
  headline_y: 230
  headline_accent_color: "0xFFD400"

  # Sous-titres & textes (unités ASS sur une hauteur de 288 : FontSize 15 ≈ 100 px en 1920)
  # Montserrat Bold, contour noir sans cartouche, capitales, chiffres en jaune (même jaune que le bandeau)
  subtitle_style: "FontName=Montserrat,FontSize=14,Bold=1,PrimaryColour=&H00FFFFFF,OutlineColour=&H00000000,BackColour=&H96000000,BorderStyle=1,Outline=1.3,Shadow=0.5,Alignment=2,MarginL=22,MarginR=22,MarginV=92"
  subtitle_uppercase: true
  subtitle_highlight_color: "#FFD400"
  font_path: "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
  source_credit_y: "h-520"
  source_credit_size: 18
  source_credit_alpha: 0.52
  source_credit_labels:
    wiki: "Source : Wikimedia Commons"
    wikimedia: "Source : Wikimedia Commons"
    openverse: "Source : Openverse"
    europeana: "Source : Europeana"
    video: "Illustration : Pexels / Pixabay"
    pexels: "Illustration : Pexels / Pixabay"
    pixabay: "Illustration : Pexels / Pixabay"
    videvo: "Illustration : Pexels / Pixabay"
    ai: "Illustration générée par IA"
    osm: "Carte : Natural Earth · Lieu : © OpenStreetMap"   # avant « map » : le premier qui correspond gagne
    map: "Carte : Natural Earth"
    gallica: "Source : Gallica / BnF"

  # Rythme : aucun plan de plus de 4 s (3 s dans la scène 1) ; une scène plus longue reçoit plusieurs
  # visuels. La carte animée, animation continue, est la seule exception.
  shots:
    enabled: true
    max_seconds: 4.0
    first_scene_max_seconds: 3.0
    max_shots_per_scene: 6
  # Cadrage : photos en paysage recadrées plein écran avec un panoramique lent (plus de fond flou)
  image_full_screen: true
  pan_speed: 0.06               # fraction de la largeur de l'écran parcourue par seconde

# Visuels
visuals:
  ai_composition: "wide-angle documentary shot, strictly centered subject, eye-level perspective"
  ai_lighting: "golden hour or blue hour light, strong directional light, clear readable subject"
  ai_texture: "visible material details, realistic weathered surfaces, natural imperfections"
  ai_palette: "rich natural colors, warm golden highlights against deep blue shadows, strong contrast"
  ai_mood: "tense, mysterious, documentary atmosphere, photojournalistic feel"
  ai_suffix: "photorealistic, ultra-realistic, real-world photography, 8k detail."
  video_fallback_query: "mysterious historical documentary atmosphere"
  ai_base_style: "cinematic realistic documentary still, photorealistic, atmospheric depth, subtle film grain, dramatic but natural lighting, rich natural textures, high visual clarity, strictly centered subject, extreme wide shot, vertical 9:16 composition, subject kept inside the center safe zone, clean space near the top and bottom for captions"
  ai_negative_prompt: "text, logo, watermark, subtitles, borders, split screen, multiple frames, deformed hands, extra fingers, duplicate people, cropped head, blurry face, cartoon, anime"
  ai_primary_model: "flux"
  # Images de toutes les scènes, dans cet ordre : (a) article Wikipédia source, (b) catégorie Commons du
  # lieu, (c) gravures et documents d'époque (Commons, Europeana, Gallica), puis second emploi des images
  # (a)-(c), (d) image générée datée et située « no modern objects », (e) vidéo de banque d'images.
  # Le type de scène ('specific' / 'generic') ne sert plus qu'à formuler la requête.
  subject_images:
    enabled: true
    max_uses_per_file: 2        # la limite porte sur le FICHIER : plusieurs photos du même lieu, oui
    min_width: 1000
    min_height: 500
    category_limit: 60
    documents: true             # gravures, lithographies, cartes postales de Commons
    europeana: true             # sans effet sans EUROPEANA_API_KEY
    gallica: false              # BnF : réutilisation commerciale soumise à licence payante, à activer
                                # seulement si la chaîne n'est pas monétisée ou après accord de la BnF
    stock_video: true           # (e) dernier recours
    stock_video_max_scenes: 1   # au-delà, avertissement dans le journal
    allowed_mime: ["image/jpeg"]  # photos seulement : les PNG du lieu sont presque toujours des cartes ou
                                  # des schémas (« Routes-Hydro.png », « Sols.png »)
    document_shots: 2           # variété : 1 ou 2 plans réservés aux documents d'époque s'il en existe
  ai_fallback_model: "turbo"
  # Carte animée « où ça se passe » (lot 1) : la France, zoom vers la région, point jaune, nom du lieu.
  # Coordonnées : page Wikipédia source, sinon géocodage Nominatim du lieu de la scène 1 ; sans
  # coordonnées ou en cas d'erreur, la scène garde son visuel habituel. Absent = désactivé.
  map_scene:
    enabled: true
    scene_index: 1            # 0 = première scène ; 1 = scène 2 (le visuel de la scène 2 est remplacé)
    geocode_fallback: true    # Nominatim (OpenStreetMap) si la page Wikipédia n'a pas de coordonnées
    geocoder_url: "https://nominatim.openstreetmap.org/search"   # remplaçable sans toucher au code
    zoom: 3.0                 # métropole : vue finale 3 fois plus serrée que la France entière
    overseas_view_km: 4500    # outre-mer : largeur de la vue de départ, centrée sur le territoire
    overseas_zoom: 10.0
    overseas_island_fraction: 0.4   # outre-mer : l'île du sujet occupe au moins 40 % de la largeur à la fin
    tagline: ""               # accroche de marque à côté du point, facultative : ex. "C’EST ARRIVÉ ICI"
    label_max_chars: 26       # étiquette : nom du sujet, ou de sa commune s'il est plus long
    landmark: true            # grande ville la plus proche en repère (point blanc + nom) ; à défaut, la
                              # préfecture la plus proche ; aucun repère si le sujet est dans la grande ville
    landmark_min_population: 100000
    landmark_min_population_overseas: 100000
# Mascotte « C’est arrivé ici » : épingle jaune expressive (assets/mystery/images/mascotte_<expression>.png).
# Carte : « curieux » se pose sur le lieu à la place du point jaune, avec un rebond.
# Vidéo : petite (150 px) à gauche, sous le bandeau-titre et au-dessus des sous-titres ; « curieux » par
# défaut, « surpris » pendant la phrase de la révélation (reveal_sentence du script), « clin » sur la
# dernière scène. Ombre portée seulement sur la carte, pas dans le coin.
mascot:
  enabled: true
  height: 150
  x: 40                   # la droite de l'écran (x > 930) est couverte par l'interface des plateformes
  y: null                 # null : juste sous le bandeau-titre (3 lignes au plus)
  on_map: true
  map_height: 190

# Publication (publish.py) — uniquement des NOMS de variables d'environnement, jamais les valeurs
publish:
  hf_repo: "soradata/AIShortvideos"   # dataset HF où le générateur dépose les vidéos
  hf_folder: "videos"                 # dossier historique de la chaîne : ne pas renommer (historique)
  zernio_key_env: "ZERNIO_API_KEY_MYSTERY"
  platforms:                          # publiées dans cet ordre
    - {platform: youtube, account_env: YOUTUBE_ACCOUNT_ID_MYSTERY}
    - {platform: tiktok,  account_env: TIKTOK_ACCOUNT_ID_MYSTERY}
  delay_between_platforms: 15
  stats:                              # boucle de feedback Zernio (bandit des hooks)
    platform: null                    # tiktok | youtube | null = toutes
    account_env: null                 # ex : TIKTOK_ACCOUNT_ID_MYSTERY pour ne lire qu'un compte
    limit: 20
  fallback_hashtags: "#histoire #patrimoine #france #cestarriveici"
  brand_hashtag: "#cestarriveici"     # ajouté à la légende s'il manque
  banned_hashtags: ["#minutemystere"]   # ancien nom, retiré de la légende (casse et accents ignorés)
